version = 1
id = "daily-bigbrain-substack-reconcile"
kind = "heartbeat"
name = "Daily Substack reconciliation"
prompt = "Run $bigbrain-substack-ingest in daily reconciliation mode using the signed-in Codex browser at https://substack.com/inbox, subscriptions sorted Recent. Verify the live owning Personal Brain and RSS registry. Register genuinely followed publications missing a validated RSS listener, using the common Substack skill, existing source guidance, and verified Brain subscription routing. Use the same persistent per-post ledger and per-publication retained watermarks as RSS and email; automation memory may retain navigation hints but is not outcome authority. Check the ledger before any duplicate article fetch, claim unresolved posts, and verify source artifacts and every intended Brain write through the owning MCP before completing shared records. Scan up to five loaded Recent pages with a seven-day overlap, carry unfinished navigation forward, and process at most five unresolved posts per run, prioritizing newest misses while reserving one slot for the oldest retryable hole. On the first run and at least weekly, traverse up to five pages of the full authenticated subscription list and resume later until its end is observed, so subscriptions absent from Recent can still be registered. Begin the authorized bounded backfill and carry unresolved older posts forward; never infer complete history from watermarks or finite RSS results. Use the shared article relevance gate, preserve full accessible source content, and record paywalls or partial retrieval as needs_review without bypassing access controls. Do not unsubscribe or remove feeds. Exit quietly when nothing actionable changes, including unchanged known blocked items. Notify only for meaningful ingestion completion, new feed registrations, new failures, or required user action. Use the owning Brain MCP substack/workflow tool to read the workflow and references and substack/ledger with operation and input for shared state. Never open TextEdit, Finder, Terminal UI, another desktop editor, or browser file URLs to read skills, configuration, scratch files, or the ledger. If required workflow or ledger tools remain unavailable after targeted discovery, defer affected posts and report the setup gap without retrieval, writes, or cursor advancement."
status = "ACTIVE"
rrule = "FREQ=DAILY;BYHOUR=8;BYMINUTE=15"
destination = "thread"
