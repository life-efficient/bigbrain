version = 1
id = "bigbrain-nightly-maintenance"
kind = "cron"
name = "BigBrain Nightly Maintenance"
prompt = "From the workspace root, run `bigbrain sync --json`, then `bigbrain health --json`. Use BigBrain: Maintain behavior to classify health findings and proactively attempt safe bounded fixes for deterministic unresolved items before the final report. For every `inbound_event_failed` or `inbound_event_quarantined` finding, inspect the exact delivery with `bigbrain events inbox`, determine whether it is retryable, needs review, or legacy, and propose one concrete resolution with the delivery ID and observed cause. Retry or discard only when the action is deterministic, safe, and idempotent; otherwise leave the event untouched and explain the proposed follow-up. After any event action, run `bigbrain events drain` and `bigbrain health --json` again. Re-run `bigbrain health --json` after any other remediation attempt. Only after sync, health, remediation, event triage, and final health verification are complete, use BigBrain: Refresh Tasks behavior as an advisory-only final step: review current page-backed `tasks/*.md` task pages from brain evidence and suggest grounded changes, but do not create, update, close, archive, reassign, or reprioritize task pages. In the final report, separate: 1) sync status, 2) health status and remediation, 3) inbound event triage with per-delivery proposed resolutions, 4) advisory task-refresh suggestions, and 5) unresolved items that still need attention. Do not guess past command output."
status = "ACTIVE"
rrule = "FREQ=DAILY;BYHOUR=3;BYMINUTE=30;BYSECOND=0"
model = "gpt-5.5"
reasoning_effort = "low"
execution_environment = "local"
cwds = ["<brain-home>"]
created_at = 1779217798002
updated_at = 1781007781948
