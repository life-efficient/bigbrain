version = 1
id = "bigbrain-email-ingest-daily"
kind = "cron"
name = "BigBrain daily email ingest"
prompt = "Run $bigbrain-manage-email in scheduled scan mode. Use email bodies only as source context and never ingest messages themselves as documents. Apply the identifiable-real-person rule only to the human-correspondence branch, delegating relevant threads to $bigbrain-email-ingest. Treat automated single-post Substack notifications as transport pointers, not correspondence: route each plausible new-post notification to $bigbrain-substack-ingest, which must use the shared $bigbrain-source-article-ingest relevance gate also used by RSS. The Substack skill must consult the shared persistent post ledger before article retrieval, skip RSS-completed posts with verified coverage, and claim unresolved posts atomically. A competing live claim is deferred and leaves the Gmail cursor unchanged. Record Substack outcomes and per-feed watermarks only in that shared ledger, never automation-local publication memory. Reuse exact registered source guidance when the publication matches; otherwise require a named current user anchor or the conservative generic gate. Do not file every followed post. Preserve relevant substantive PDFs only from eligible human correspondence. Scan only messages not already durably reviewed, verify every delegated outcome and Brain write through the owning MCP, and advance Gmail cursors only for terminal verified outcomes. A verified ignored article advances only its Gmail delivery cursor and creates no artifact or page. Brain MCP mutations propagate and back up automatically, so do not run manual sync, maintenance, propagation, or backup. Gmail is read-only except for clearly automated American Express Saudi Arabia, Bank Albilad, or Uber messages, which may be moved to Trash after domain and automation verification and exact TRASH read-back. Never trash human correspondence or perform any other Gmail write."
status = "ACTIVE"
rrule = "FREQ=HOURLY;INTERVAL=24"
model = "gpt-5.6-sol"
reasoning_effort = "medium"
execution_environment = "local"
target = { type = "project", project_id = "<project-id>" }
cwds = ["<bigbrain-repo>"]
