version = 1
id = "bigbrain-check-update"
kind = "cron"
name = "BigBrain Source Update Fallback"
prompt = "Use $bigbrain-check-update only for a source-managed BigBrain checkout. Route packaged desktop installs to the in-app updater. Preserve local work, apply relevant changelog actions, refresh safe repo-owned skills and automations, merge filing-rule changes without overwriting user rules, and verify the CLI, tests, selected brain, exact local service version, MCP tools, and Codex registration. Never reinstall desktop-bundle, remote, unknown-owner, or newer independently managed services."
status = "PAUSED"
rrule = "FREQ=DAILY;BYHOUR=4;BYMINUTE=15;BYSECOND=0"
model = "gpt-5.5"
reasoning_effort = "low"
execution_environment = "local"
cwds = ["<bigbrain-repo>"]
created_at = 1781010000000
updated_at = 1781010000000
