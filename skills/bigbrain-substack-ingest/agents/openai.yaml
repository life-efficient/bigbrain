interface:
  display_name: "BigBrain: Substack Ingest"
  short_description: "Reconcile Substack feeds and ingest missed posts"
  default_prompt: "Run $bigbrain-substack-ingest for this Substack RSS event, email handoff, direct post, daily subscription reconciliation, or bounded backfill. Check the shared ledger before fetching and claim unresolved posts. Reuse exact source guidance and the shared article relevance gate, preserve relevant sources, connect durable updates to canonical pages, and complete shared outcomes and per-publication watermarks. Use any available documented browser or article-retrieval tool, preferring the in-Codex browser when available; never use desktop file apps to inspect local workflow files or state. Explain relevance, whether the article was ingested or skipped, and anything that went wrong in natural prose without a structured schema or internal outcome labels. For readable RSS articles include a one-paragraph summary even when skipped, reusing previously saved content for duplicates; explain access gaps without inventing a summary. During authorized reconciliation register missing followed feeds, carry older holes forward, and exit quietly on a no-op. Return email handoffs without changing Gmail."
