interface:
  display_name: "BigBrain: Substack Ingest"
  short_description: "Reconcile Substack feeds and ingest missed posts"
  default_prompt: "Run $bigbrain-substack-ingest for this Substack RSS event, email handoff, direct post, daily subscription reconciliation, or bounded backfill. Check the shared ledger before fetching and claim unresolved posts. Reuse exact source guidance and the shared article relevance gate, verify saved source and canonical coverage, and complete shared outcomes and per-publication watermarks. During authorized reconciliation register missing followed feeds, carry older holes forward, and exit quietly on a no-op. Return email handoffs without changing Gmail."
