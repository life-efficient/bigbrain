interface:
  display_name: "BigBrain: Substack Ingest"
  short_description: "Reconcile Substack feeds and ingest missed posts"
  default_prompt: "Run $bigbrain-substack-ingest for this Substack RSS event, email handoff, direct post, daily subscription reconciliation, or bounded backfill. Accepted posts belong in the owning Brain's articles/ collection with preserved source and indexed sidecars under articles/.raw/. Check the shared ledger before fetching and claim unresolved posts. Reuse exact source guidance and the shared article relevance gate through $bigbrain-source-article-ingest, preserve relevant sources, require published_date as the publisher ISO timestamp and article_url as canonical provenance, connect durable updates to canonical pages through $bigbrain-page, and complete shared outcomes and per-publication watermarks. When a substantive canonical preview clears relevance but access is blocked, preserve exactly the readable portion as preview-only, record source_partial, and advance the verified watermark after the saved content and provenance are read back. If no reliable readable source is available, record needs_review as a semantic non-ingestion result with a reason, not as a runtime execution error. Use any available documented browser or article-retrieval tool, preferring the in-Codex browser when available; never use desktop file apps to inspect local workflow files or state. Explain relevance, whether the article was ingested, partially ingested, or not ingested, and anything that went wrong in natural prose without a structured schema or internal outcome labels. For readable RSS articles include a one-paragraph summary whether the article was ingested or not, reusing previously saved content for duplicates; explain access gaps without inventing a summary. During authorized reconciliation register missing followed feeds, carry older holes forward, and exit quietly on a no-op. Return email handoffs to $bigbrain-manage-email without changing Gmail."
