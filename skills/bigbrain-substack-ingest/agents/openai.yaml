interface:
  display_name: "BigBrain: Substack Ingest"
  short_description: "Ingest verified Substack posts into BigBrain"
  default_prompt: "Run $bigbrain-substack-ingest for this verified Substack post or explicit bounded archive request. Keep automated delivery eligibility separate from content relevance, reuse exact registered RSS guidance when the publication matches, apply the shared $bigbrain-source-article-ingest relevance gate, use source_type: substack with Gmail delivery identity as origin metadata, update canonical pages only for durable value through $bigbrain-page, record terminal ignored outcomes without moving publication watermarks, verify every write, and return to $bigbrain-manage-email without changing Gmail."
