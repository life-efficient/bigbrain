interface:
  display_name: "BigBrain: Source Article Ingest"
  short_description: "Apply one shared article relevance gate"
  default_prompt: "Run $bigbrain-source-article-ingest as the sole relevance and filing workflow for this RSS, Substack, email-delivered, or direct article. Before fetching a Substack article, use $bigbrain-substack-ingest for its shared ledger preflight unless already delegated by that adapter. For RSS-triggered ingestion, explicitly select the in-Codex browser; if unavailable after targeted tool discovery, explain the access problem instead of silently using an external browser unless the user explicitly requests one. First read any registered source guidance or name a current user anchor and apply the shared relevance gate before any write. For accepted articles, read and execute the shared ingestion completeness checklist for canonical entity pages, links, and verified coverage. Explain relevance, whether it was ingested or skipped, and anything that went wrong in natural prose without a structured schema or internal outcome labels. For every readable RSS article, include a one-paragraph summary even when skipped; reuse previously verified content for duplicates and explain unavailable content rather than inventing a summary."
