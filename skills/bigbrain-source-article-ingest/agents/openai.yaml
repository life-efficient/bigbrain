interface:
  display_name: "BigBrain: Source Article Ingest"
  short_description: "Apply one shared article relevance gate"
  default_prompt: "Run $bigbrain-source-article-ingest as the sole relevance and filing workflow for this RSS, Substack, email-delivered, or direct article. For generic RSS, use rss/workflow and rss/ledger to preflight shared per-feed state and claim before retrieval; complete after the source and any canonical updates are saved and read back. Use targeted tool discovery if missing and stop unchanged without desktop file workarounds. Before fetching a Substack article, use $bigbrain-substack-ingest for its shared ledger preflight unless already delegated by that adapter. For RSS-triggered ingestion, use any available documented browser or article-retrieval tool, preferring the in-Codex browser when available. First read registered source guidance or name a current user anchor and apply the shared relevance gate before any write. For accepted articles, use the shared ingestion completeness checklist to preserve the source and connect durable updates to canonical pages. Explain relevance, whether it was ingested or skipped, and anything that went wrong in natural prose without a structured schema or internal outcome labels. For every readable RSS article, include a one-paragraph summary even when skipped; reuse previously saved content for duplicates and explain unavailable content rather than inventing a summary."
