interface:
  display_name: "BigBrain: Source Article Ingest"
  short_description: "Ingest relevant articles with faithful text, useful facts, and clean reading copy"
  default_prompt: "Run $bigbrain-source-article-ingest as the sole relevance and filing workflow for this RSS, Substack, newsletter, email-delivered, or direct online article. Accepted source publications belong in the owning Brain's articles/ collection with preserved material and indexed sidecars under articles/.raw/. For generic RSS, use rss/workflow and rss/ledger to preflight shared per-feed state and claim before retrieval; complete after the source and any canonical updates are saved and read back. Use targeted tool discovery if missing and stop unchanged without desktop file workarounds. Before fetching a Substack article, use $bigbrain-substack-ingest for its shared ledger preflight unless already delegated by that adapter. For RSS-triggered ingestion, use any available documented browser or article-retrieval tool, preferring the in-Codex browser when available. First read registered source guidance or name a current user anchor and apply the shared relevance gate before any write. For accepted articles, use the shared ingestion completeness checklist to preserve the source and connect durable updates to canonical pages. Require published_date as the publisher ISO timestamp and article_url as canonical provenance. Keep substantive publisher text verbatim and in order in the indexed reading copy, but omit bounded subscription, channel-join, and sponsorship calls to action; log each omitted block and its location, and preserve original source bytes separately when available. Do not dismiss an entire promotional post by default. When a substantive canonical preview clears relevance but access is blocked, preserve the readable publisher bytes separately when available, save only the readable substantive portion as preview-only indexed text subject to logged promotional cleanup, record source_partial, and advance the verified watermark after the saved content and provenance are read back. If no reliable readable source is available, record needs_review as a semantic non-ingestion result with a reason, not as a runtime execution error. Explain relevance, whether it was ingested, partially ingested, or not ingested, and anything that went wrong in natural prose without a structured schema or internal outcome labels. For every readable RSS article, include a one-paragraph summary whether it was ingested or not; reuse previously saved content for duplicates and explain unavailable content rather than inventing a summary. Include a near-top Fact Sheet only for substantial, attributed recall-worthy facts supported by the verified source; omit it otherwise."
