interface:
  display_name: "BigBrain: Meeting Ingest"
  short_description: "Process one canonical meeting directly or for a source-ingestion caller"
  default_prompt: "Use $bigbrain-meeting-ingest to process one meeting, preserve its canonical page and prep, classify candidate transactions before creating pages, reconcile each sufficiently identified actual deal to one canonical deal page, and keep VDR and diligence evidence in deal-owned raw sidecars. Keep unrecorded note-only meetings in summary sidecars without fabricating raw transcripts. Preserve actual transcript artifacts, speaker-level ownership, entity context, and $bigbrain-action-review task judgment. In delegated mode, verify the per-meeting writes and explicitly return control to the calling ingestion skill without taking over its verification, ledger, cursor, batch, or reporting lifecycle."
