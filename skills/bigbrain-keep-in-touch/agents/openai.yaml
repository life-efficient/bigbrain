interface:
  display_name: "BigBrain: Keep in Touch"
  short_description: "Review changed people pages and surface the next useful relationship touches"
  default_prompt: "Use $bigbrain-keep-in-touch to run the daily Keep in Touch review in a bounded oldest-first batch, update its private registry and cursor, and report every scanned person and outcome. Include the complete due and overdue queue, a suggested channel for each person, and unsent message drafts wherever evidence supports them. Never send or queue messages."
