interface:
  display_name: "BigBrain Email Ingest"
  short_description: "Reconcile email, followed Substack posts, actions, cleanup, and PDFs"
  default_prompt: "Run $bigbrain-email-ingest to scan recently unchecked email, ingest verified new-post notifications from followed Substack publications by opening each canonical post and invoking $bigbrain-source-article-ingest, keep Gmail delivery cursors separate from one per-publication Substack content cursor keyed by normalized publication and post URLs, maintain monotonic high and low watermarks with bounded explicit backfill, reconcile user-reported outbound sends through Gmail without resending, distinguish draft_prepared, approved, sent, sent_and_logged, send_unverified, needs_review, and reconciliation_incomplete, provide the mandatory significance field on every create_page or update_page call as patch, minor, or major based on owning-page impact, preserve append-only history including deliberate corrections, preserve email-specific sender and recipient direction, chronology, quoted-history boundaries, and automated-versus-human authorship, invoke $bigbrain-action-review before task writes, apply only the standing authorized Gmail Trash rules, preserve relevant substantive PDFs through the owning Brain's MCP, prevent replay of identical events with stable action and provider keys, and verify every Brain write, article source, cleanup action, and cursor advance."
