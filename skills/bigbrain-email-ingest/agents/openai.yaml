interface:
  display_name: "BigBrain Email Ingest"
  short_description: "Reconcile email evidence, actions, cleanup, and PDFs"
  default_prompt: "Run $bigbrain-email-ingest to scan recently unchecked email, reconcile user-reported outbound sends through Gmail without resending, distinguish draft_prepared, approved, sent, sent_and_logged, send_unverified, needs_review, and reconciliation_incomplete, label every timeline update as patch, minor, or major by its impact on the owning page, preserve append-only history including deliberate corrections, preserve email-specific sender and recipient direction, chronology, quoted-history boundaries, and automated-versus-human authorship, invoke $bigbrain-action-review before task writes, apply only the standing authorized Gmail Trash rules, preserve relevant substantive PDFs through the owning Brain's MCP, prevent replay of identical events with stable action and provider keys, and verify every Brain write, stored artifact, cleanup action, and cursor advance."
