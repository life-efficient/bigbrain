interface:
  display_name: "BigBrain Email Ingest"
  short_description: "Route email, Substack posts, actions, cleanup, and PDFs"
  default_prompt: "Run $bigbrain-email-ingest to scan recently unchecked email, route plausible followed-Substack post notifications to $bigbrain-substack-ingest with complete delivery evidence, keep the Gmail delivery cursor separate from the Substack skill's per-publication content cursor, reconcile user-reported outbound sends through Gmail without resending, distinguish draft_prepared, approved, sent, sent_and_logged, send_unverified, needs_review, and reconciliation_incomplete, provide the mandatory significance field on every create_page or update_page call as patch, minor, or major based on owning-page impact, preserve append-only history including deliberate corrections, preserve email-specific sender and recipient direction, chronology, quoted-history boundaries, and automated-versus-human authorship, invoke $bigbrain-action-review before task writes, apply only the standing authorized Gmail Trash rules, preserve relevant substantive PDFs through the owning Brain's MCP, prevent replay of identical events with stable action and provider keys, and verify every Brain write, delegated Substack outcome, cleanup action, and Gmail cursor advance."
