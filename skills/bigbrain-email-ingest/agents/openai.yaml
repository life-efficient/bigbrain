  short_description: "Ingest one human-authored email thread"
  default_prompt: "Run $bigbrain-email-ingest for this dispatcher-classified human-authored email thread. Use the body only as source context, preserve relevant substantive PDFs, route to one owning Brain, invoke $bigbrain-action-review before task writes, provide significance and provenance on page mutations, verify every Brain outcome through the same MCP, make no Gmail change, and return a cursor-safe handoff to $bigbrain-manage-email."
